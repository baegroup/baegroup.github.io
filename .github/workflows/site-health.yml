name: Weekly Site Health

on:
  schedule:
    - cron: '15 0 * * 1' # Every Monday 09:15 KST (UTC+9)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-site-health
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Validate repository content and assets
        run: npm run check

      - name: Verify production build
        run: npm run build

      - name: Audit the public website
        run: npm run audit:live

name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - Instagram Sync
    types:
      - completed
  workflow_dispatch:
  workflow_call:
    inputs:
      report_notion_status:
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # A content sync only needs a deployment when it advanced the default branch.
    # For workflow_run events, github.sha is the latest default-branch commit,
    # while workflow_run.head_sha is the commit from which the sync started.
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_sha != github.sha
        )
      }}
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Mark deployment started
        if: inputs.report_notion_status == true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_AEROLITH_TOKEN }}
        run: node scripts/notion-publish-status.mjs deploying

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate site content and assets
        run: npm run check

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      # Artifact metadata can briefly be unavailable immediately after upload.
      # Retry the same immutable artifact once; a second failure still fails the job.
      - name: Wait before retrying Pages deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 15

      - name: Retry GitHub Pages deployment
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Record successful deployment
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_AEROLITH_TOKEN }}
        run: |
          export DEPLOYED_SHA="$(git rev-parse HEAD)"
          node scripts/notion-publish-status.mjs success

      - name: Report deployment failure
        if: (failure() || cancelled()) && steps.deployment.outcome != 'success' && steps.deployment_retry.outcome != 'success' && inputs.report_notion_status == true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_AEROLITH_TOKEN }}
        run: node scripts/notion-publish-status.mjs failure

      - name: Notify Naver IndexNow
        run: npm run seo:indexnow

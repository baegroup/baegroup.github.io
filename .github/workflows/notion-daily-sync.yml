name: Daily Notion Sync

on:
  schedule:
    - cron: '30 15 * * *' # Every day 00:30 KST (UTC+9)
    - cron: '2-57/5 * * * *' # Check Notion button requests; GitHub may delay scheduled runs.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate sync without publishing content changes
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: content-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.request.outputs.claimed }}
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_AEROLITH_TOKEN }}
      NOTION_NEWS_DB_ID: d42f3566-2a74-82c5-a3aa-81daf4063b28
      NOTION_NEWS_DATA_SOURCE_ID: ae1f3566-2a74-8315-a78b-87e11ccf2ba7
      NOTION_TEAM_DB_ID: d7cf3566-2a74-8361-84b0-81c69d1f920d
      NOTION_TEAM_DATA_SOURCE_ID: 2bbf3566-2a74-8238-a1fa-07877290178c
      NOTION_PUBLICATIONS_DB_ID: 53cf3566-2a74-8285-958f-819dc956eeca
      NOTION_PUBLICATIONS_DATA_SOURCE_ID: 5ebf3566-2a74-82ae-a97c-878fc2f49c7a
      NOTION_PATENTS_DB_ID: b18f3566-2a74-834c-b65c-81c24f701f38
      NOTION_PATENTS_DATA_SOURCE_ID: eb7f3566-2a74-83c8-9296-078877ab519a
      NOTION_PRESENTATIONS_DB_ID: d2cf3566-2a74-83df-b67b-01ffd706d286
      NOTION_PRESENTATIONS_DATA_SOURCE_ID: 38af3566-2a74-829c-887d-074446651454
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check and claim publish request
        id: request
        env:
          FORCE_SYNC: ${{ github.event_name != 'schedule' || github.event.schedule == '30 15 * * *' }}
          DRY_RUN: ${{ inputs.dry_run == true || github.ref != 'refs/heads/main' }}
        run: node scripts/notion-publish-status.mjs claim

      - name: Setup Node.js
        if: steps.request.outputs.should_run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.request.outputs.should_run == 'true'
        run: npm ci

      - name: Validate Notion configuration
        if: steps.request.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          required=(
            NOTION_TOKEN
            NOTION_NEWS_DB_ID
            NOTION_TEAM_DB_ID
            NOTION_PUBLICATIONS_DB_ID
            NOTION_PATENTS_DB_ID
            NOTION_PRESENTATIONS_DB_ID
          )
          missing=()
          for key in "${required[@]}"; do
            if [[ -z "${!key:-}" ]]; then
              missing+=("$key")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required configuration: ${missing[*]}"
            echo "::error::Set repository secret NOTION_AEROLITH_TOKEN with access to the Bae Lab Website CMS in Aerolith3d."
            exit 1
          fi

          if [[ "${NOTION_TOKEN}" != ntn_* ]]; then
            echo "::warning::NOTION_TOKEN does not start with 'ntn_'. Check whether an old token was configured."
          fi

      - name: Sync CMS from Notion
        if: steps.request.outputs.should_run == 'true'
        run: npm run cms:sync:notion

      - name: Validate synced content and assets
        if: steps.request.outputs.should_run == 'true'
        run: npm run check

      - name: Commit and push changes
        if: steps.request.outputs.claimed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A public/data public/assets/img/news/notion public/assets/img/news/instagram public/assets/img/team/notion public/assets/img/publications/covers

          if git diff --cached --quiet; then
            echo "No content changes to commit."
            exit 0
          fi

          git commit -m "chore: daily notion sync"
          git push origin HEAD:main

      - name: Mark deployment queued
        if: steps.request.outputs.claimed == 'true'
        run: node scripts/notion-publish-status.mjs waiting

      - name: Report sync failure
        if: (failure() || cancelled()) && steps.request.outputs.claimed == 'true'
        run: node scripts/notion-publish-status.mjs failure

  deploy:
    needs: sync
    if: needs.sync.outputs.publish == 'true'
    uses: ./.github/workflows/pages.yml
    with:
      report_notion_status: true
    secrets: inherit
